[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "identity_studio"
version = "0.2.0"
description = "AI Identity Transformation Studio"
authors = [{ name = "AI Identity Studio Team" }]
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.10.0,<5.0.0",
    "numpy>=1.26.0,<2.0.0",
    "mediapipe>=0.10.14",
    "tabulate>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
